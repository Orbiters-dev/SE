name: JP Perf Board — 일일 액션 판정 + 배포

# 보드(https://jp-perf-board.vercel.app) 「오늘의 액션」 데이터 생산자.
# 확정 룰(Meta IHV D3~9 CPLPV·Amazon SBV v1.1·WL 졸업/OFF 미러)을 매일 실데이터에
# 적용해 actions.json 생성 → 보드와 함께 Vercel 재배포.
# grad_off(JST 09:12) 보다 먼저 돌아 "오늘 자동집행 예정" 을 미러한다.

on:
  schedule:
    - cron: '40 23 * * *'   # KST 08:40
    - cron: '5 0 * * *'     # KST 09:05 (안전망)
  workflow_dispatch:
    inputs:
      skip_amz:
        description: 'Amazon 풀 생략 (Meta만 빠르게)'
        type: boolean
        default: false

jobs:
  dedup:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check today already succeeded (KST)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          DECISION=$(python3 - << 'EOF'
          import json, subprocess
          from datetime import datetime, timezone, timedelta
          KST = timezone(timedelta(hours=9))
          today = datetime.now(KST).date()
          out = subprocess.check_output(['gh','run','list','-R','${{ github.repository }}','-w','jp_perf_actions.yml','-L','20','--json','conclusion,createdAt,databaseId'])
          runs = json.loads(out)
          for r in runs:
              if r['conclusion'] != 'success': continue
              t = datetime.fromisoformat(r['createdAt'].replace('Z','+00:00')).astimezone(KST).date()
              if t == today and str(r['databaseId']) != "${{ github.run_id }}":
                  print("false")
                  break
          else:
              print("true")
          EOF
          )
          echo "should_run=$DECISION" >> $GITHUB_OUTPUT

  judge-and-deploy:
    needs: dedup
    if: needs.dedup.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet requests python-dotenv

      - name: Write .env
        run: |
          cat > .env << 'ENVEOF'
          META_JP_ACCESS_TOKEN=${{ secrets.META_JP_ACCESS_TOKEN }}
          META_JP_AD_ACCOUNT_ID=${{ secrets.META_JP_AD_ACCOUNT_ID }}
          DK_SE_READ_TOKEN=${{ secrets.DK_SE_READ_TOKEN }}
          ORBITOOLS_USER=${{ secrets.ORBITOOLS_USER }}
          ORBITOOLS_PASS=${{ secrets.ORBITOOLS_PASS }}
          AMZ_ADS_JP_CLIENT_ID=${{ secrets.AMZ_ADS_JP_CLIENT_ID }}
          AMZ_ADS_JP_CLIENT_SECRET=${{ secrets.AMZ_ADS_JP_CLIENT_SECRET }}
          AMZ_ADS_JP_REFRESH_TOKEN=${{ secrets.AMZ_ADS_JP_REFRESH_TOKEN }}
          AMZ_ADS_JP_PROFILE_ID=${{ secrets.AMZ_ADS_JP_PROFILE_ID }}
          ENVEOF

      - name: Run daily judgment
        env:
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.skip_amz }}" = "true" ]; then
            ARGS="--skip-amz"
          fi
          python -u tools/jp_perf_actions.py $ARGS

      - name: Deploy board to Vercel
        env:
          VERCEL_ORG_ID: team_Gi2FdtDzUnhOJZhd0lETQmQF
          VERCEL_PROJECT_ID: prj_50pI5GTq2wuio9ito6UW1DhuvEH6
        run: |
          cp .tmp/jp_perf_actions/actions.json web/jp_perf_board/actions.json
          npm install -g vercel@latest
          vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }} --cwd web/jp_perf_board

      - name: Upload actions.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jp-perf-actions-${{ github.run_id }}
          path: .tmp/jp_perf_actions/actions.json
          retention-days: 14

      - name: Notify Teams on failure
        if: failure()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then exit 0; fi
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"❌ jp_perf_actions 실패 — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$TEAMS_WEBHOOK_URL"
