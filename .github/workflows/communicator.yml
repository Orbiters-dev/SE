name: ORBI Communicator (12h Status Email)

on:
  schedule:
    # PST 0:00 (= UTC 08:00)
    - cron: "0 8 * * *"
    # PST 12:00 (= UTC 20:00)
    - cron: "0 20 * * *"
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  send-status-email:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Gmail credentials
        run: |
          mkdir -p credentials
          echo '${{ secrets.GMAIL_OAUTH_CREDENTIALS_JSON }}' > credentials/gmail_oauth_credentials.json
          echo '${{ secrets.GMAIL_TOKEN_JSON }}' > credentials/gmail_token.json

      - name: Run communicator
        env:
          ORBITOOLS_USER: ${{ secrets.ORBITOOLS_USER }}
          ORBITOOLS_PASS: ${{ secrets.ORBITOOLS_PASS }}
          DK_SE_READ_TOKEN: ${{ secrets.DK_SE_READ_TOKEN }}
          GMAIL_OAUTH_CREDENTIALS_PATH: credentials/gmail_oauth_credentials.json
          GMAIL_TOKEN_PATH: credentials/gmail_token.json
          GMAIL_SENDER: orbiters11@gmail.com
        run: |
          python tools/run_communicator.py
