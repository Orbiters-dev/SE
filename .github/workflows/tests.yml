name: Tests

on:
  pull_request:
    paths:
      - 'tools/data_keeper_client.py'
      - 'tools/generate_fin_data.py'
      - 'tests/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv pytest

      # test_workflow_optimizer.py 는 anthropic SDK 가 있어야 import 된다 — 이 경로들과 관계없어 뺀다.
      - name: Run tests
        run: python -m pytest -q tests/ --ignore=tests/test_workflow_optimizer.py
