name: WL D+3 Auto Upload (JP) — 콘텐츠 심사 통과분 자동 광고화

# 로컬 Task Scheduler(JPDash_WL_AutoUpload) 가 이 PC 의 S0 Modern Standby 절전에
# 걸려 0xC000013A 로 반복 즉사 → 클라우드(GitHub Actions)로 이전. PC 상태와 무관하게 실행.
# 도구는 순수 API(urllib/gspread). covered_sets 기반 자연 멱등이라 다중 cron 재시도 안전.

on:
  schedule:
    # JST 09:00 목표(UTC 00:00). GH cron 지연/누락 대비 다중 시도 + dedup 가드.
    - cron: '2 0 * * *'    # JST 09:02
    - cron: '20 0 * * *'   # JST 09:20
    - cron: '45 0 * * *'   # JST 09:45 (마지막 안전망)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (집행/알림 없이 계획만 출력)'
        type: boolean
        default: false

jobs:
  dedup:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check today already succeeded (KST)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "manual/dispatch — proceed"
            exit 0
          fi
          DECISION=$(python3 - << 'EOF'
          import json, subprocess
          from datetime import datetime, timezone, timedelta
          KST = timezone(timedelta(hours=9))
          today = datetime.now(KST).date()
          out = subprocess.check_output(['gh','run','list','-R','${{ github.repository }}','-w','wl_auto_upload.yml','-L','20','--json','conclusion,createdAt,databaseId'])
          runs = json.loads(out)
          for r in runs:
              if r['conclusion'] != 'success': continue
              t = datetime.fromisoformat(r['createdAt'].replace('Z','+00:00')).astimezone(KST).date()
              if t == today and str(r['databaseId']) != "${{ github.run_id }}":
                  print("false")
                  break
          else:
              print("true")
          EOF
          )
          echo "should_run=$DECISION" >> $GITHUB_OUTPUT
          echo "Decision: $DECISION (today KST already succeeded? -> false means skip)"

  upload:
    needs: dedup
    if: needs.dedup.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --quiet \
            gspread \
            google-auth \
            google-auth-oauthlib \
            google-api-python-client \
            requests \
            python-dotenv

      - name: Write .env
        run: |
          cat > .env << 'ENVEOF'
          META_JP_ACCESS_TOKEN=${{ secrets.META_JP_ACCESS_TOKEN }}
          META_JP_SYSUSER_TOKEN=${{ secrets.META_JP_SYSUSER_TOKEN }}
          ORBITOOLS_USER=${{ secrets.ORBITOOLS_USER }}
          ORBITOOLS_PASS=${{ secrets.ORBITOOLS_PASS }}
          TEAMS_WEBHOOK_URL_SEEUN=${{ secrets.TEAMS_WEBHOOK_URL_SEEUN }}
          GMAIL_OAUTH_CREDENTIALS_PATH=credentials/gmail_oauth_credentials.json
          GMAIL_TOKEN_PATH=credentials/gmail_token.json
          GMAIL_SENDER=orbiters11@gmail.com
          ENVEOF

      - name: Write credentials
        run: |
          mkdir -p credentials
          printf '%s' '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > credentials/google_service_account.json
          echo '${{ secrets.GMAIL_OAUTH_CREDENTIALS_JSON }}' > credentials/gmail_oauth_credentials.json
          echo '${{ secrets.GMAIL_TOKEN_JSON }}'             > credentials/gmail_token.json

      - name: Run WL auto upload
        env:
          PYTHONIOENCODING: utf-8
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          ARGS=""
          if [ "$DRY" = "true" ]; then
            ARGS="--dry-run"
          fi
          python -u tools/wl_auto_upload.py $ARGS

      - name: Notify Teams on failure
        if: failure()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "TEAMS_WEBHOOK_URL secret 미설정 — 알림 스킵"
            exit 0
          fi
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"❌ wl_auto_upload 실패 — ${{ github.run_id }} | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$TEAMS_WEBHOOK_URL"
